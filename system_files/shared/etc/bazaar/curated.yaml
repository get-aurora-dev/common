# https://gitlab.gnome.org/World/bazaar/-/blob/main/docs/example.yaml?ref_type=heads
# https://gitlab.gnome.org/World/bazaar/-/blob/main/docs/overview.md?ref_type=heads

# Don't put apps without branding colors into a "featured-carousel" it looks bad
# on list: sections of 12 apps look nice at all window widths
rows:
  - banner:
      height: 200
      image:
        # TODO: we can put these on the image if we want
        light-uri: https://getaurora.dev/aurora-trans.svg
        dark-uri: https://getaurora.dev/aurora-trans.svg
        fit: contain # contain, fill, cover or scale-down
        alt: "Aurora Logo"
        can-shrink: true
        halign: center
      # these are just the stock adwaita colors can we just make it transparent?
      light-color: "#fdfdfd"
      dark-color: "#343437"

  - section:
      overflow-count: 4
      title: "Our favorite applications"
      # Directly features an install button on the card, use when a section has little apps.
      list-type: rich
      appids:
